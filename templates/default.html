            <a href="https://github.com/JaredCorduan/JaredCorduan.github.io/tree/trunk"><i class="fab fa-github"></i></a>
        </footer>

        <script>
            // Theme switcher with localStorage persistence
            (function() {
                const body = document.body;

                const themeNames = {
                    clearsky: 'Clearsky',
                    copper: 'Copper',
                    forest: 'Forest',
                    gruvbox: 'Gruvbox',
                    midnight: 'Midnight',
                    nord: 'Nord',
                    notebook: 'Notebook',
                    ocean: 'Ocean',
                    paper: 'Paper',
                    pastel: 'Pastel',
                    solarized: 'Solarized',
                    sunset: 'Sunset',
                    synthwave: 'Synthwave',
                    terminal: 'Terminal',
                    violet: 'Violet'
                };

                // Load saved theme or use default
                const savedTheme = localStorage.getItem('blog-theme') || 'notebook';

                // Apply the theme
                function setTheme(theme) {
                    // Remove all theme classes
                    body.classList.remove('theme-violet', 'theme-notebook', 'theme-forest', 'theme-clearsky', 'theme-pastel', 'theme-synthwave', 'theme-terminal', 'theme-nord', 'theme-gruvbox', 'theme-ocean', 'theme-midnight', 'theme-sunset', 'theme-solarized', 'theme-copper', 'theme-paper');
                    // Add the selected theme
                    body.classList.add('theme-' + theme);
                    // Save to localStorage
                    localStorage.setItem('blog-theme', theme);
                    // Update the toggle button display
                    updateToggleDisplay(theme);
                    // Update active state in dropdown
                    updateActiveOption(theme);
                }

                function updateToggleDisplay(theme) {
                    const themeName = document.getElementById('current-theme-name');
                    if (themeName) {
                        themeName.textContent = themeNames[theme] || 'Notebook';
                    }
                }

                function updateActiveOption(theme) {
                    const options = document.querySelectorAll('.theme-option');
                    options.forEach(opt => {
                        if (opt.dataset.theme === theme) {
                            opt.classList.add('active');
                        } else {
                            opt.classList.remove('active');
                        }
                    });
                }

                // Set initial theme immediately
                setTheme(savedTheme);

                // Wait for DOM to be ready before setting up the picker
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initThemePicker);
                } else {
                    initThemePicker();
                }

                function initThemePicker() {
                    const toggle = document.getElementById('theme-toggle');
                    const dropdown = document.getElementById('theme-dropdown');
                    const options = document.querySelectorAll('.theme-option');

                    if (!toggle || !dropdown) return;

                    // Update initial display
                    updateToggleDisplay(savedTheme);
                    updateActiveOption(savedTheme);

                    // Toggle dropdown
                    toggle.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const isOpen = dropdown.classList.contains('open');
                        dropdown.classList.toggle('open');
                        toggle.setAttribute('aria-expanded', !isOpen);
                    });

                    // Handle option selection
                    options.forEach(option => {
                        option.addEventListener('click', function() {
                            const theme = this.dataset.theme;
                            setTheme(theme);
                            dropdown.classList.remove('open');
                            toggle.setAttribute('aria-expanded', 'false');
                        });
                    });

                    // Close dropdown when clicking outside
                    document.addEventListener('click', function(e) {
                        if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
                            dropdown.classList.remove('open');
                            toggle.setAttribute('aria-expanded', 'false');
                        }
                    });

                    // Close dropdown on Escape key
                    document.addEventListener('keydown', function(e) {
                        if (e.key === 'Escape' && dropdown.classList.contains('open')) {
                            dropdown.classList.remove('open');
                            toggle.setAttribute('aria-expanded', 'false');
                            toggle.focus();
                        }
                    });
                }
            })();
        </script>
    </body>
</html>
